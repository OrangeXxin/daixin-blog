baseURL = "https://dexter-blog.pages.dev/"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "深夜树洞"
theme = "PaperMod"

enableRobotsTXT = true
enableEmoji = true
pygmentsUseClasses = true

# 主菜单
[[menu.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 2
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 3

[params]
  env = "production"
  title = "深夜树洞"
  description = "一个21岁年轻人的内心独白——关于生活、情感、思考与成长。深夜台灯下，写给自己看的字。"
  author = "Dexter"
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = false
  ShowWordCount = true
  ShowToc = false
  ShowLastModified = false
  DateFormat = "2006年01月02日"

  # 首页欢迎区
  [params.homeInfoParams]
    Title = "深夜，灯还亮着"
    Content = "这里是一个树洞。\n\n一个21岁的年轻人，在山东的深夜里，写下那些不好意思对别人说的话。\n\n关于家乡，关于身体，关于爱而不得，关于选择与迷茫，关于玄学与宿命，关于文字本身。\n\n如果你恰好路过，欢迎坐下。不用说话，听就好。"

  # 社交链接
  [[params.socialIcons]]
      name = "github"
      url = "https://github.com/OrangeXxin"
    [[params.socialIcons]]
      name = "email"
      url = "mailto:hi.dexterzhu@gmail.com"

  # 归档/搜索页配置
  [params.assets]
    disableHLJS = true

  [params.cover]
    linkFullImages = true

  [params.editPost]
    URL = ""
    Text = "编辑"
    appendFilePath = false

# 输出格式：首页额外生成 RSS 和 JSON（供搜索使用）
[outputs]
  home = ["HTML", "RSS", "JSON"]
